name: Deploy Knight Medical Billing to VPS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy to confirm a production deployment"
        required: true
        type: string

concurrency:
  group: knight-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: ${{ inputs.confirm == 'deploy' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then echo "Missing repository secret: $name"; exit 1; fi
          done

      - name: Install restricted SSH identity
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/knight_deploy
          chmod 600 ~/.ssh/knight_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release without production data or secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          PORT="${VPS_PORT:-22}"
          SHA="${{ github.sha }}"
          ssh -i ~/.ssh/knight_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" "mkdir -p /srv/knight/releases/$SHA"
          rsync -az --delete \
            --exclude='.git/' --exclude='.next/' --exclude='node_modules/' \
            --exclude='data/' --exclude='blog-media/' --exclude='.env' --exclude='.env.*' \
            --exclude='preview/' --exclude='tsconfig.tsbuildinfo' \
            -e "ssh -i ~/.ssh/knight_deploy -p $PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            ./ "$VPS_USER@$VPS_HOST:/srv/knight/releases/$SHA/"

      - name: Backup, build, migrate, health-check or roll back
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          PORT="${VPS_PORT:-22}"
          SHA="${{ github.sha }}"
          ssh -i ~/.ssh/knight_deploy -p "$PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" "sudo /srv/knight/releases/$SHA/ops/deploy.sh $SHA"

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/knight_deploy
