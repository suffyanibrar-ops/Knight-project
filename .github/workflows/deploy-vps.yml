name: Deploy Knight Medical Billing to VPS

# Automatic after a push to main, gated by the protected GitHub Environment
# named "production". Configure required reviewers on that environment before
# enabling this workflow. Manual dispatch is restricted to the main branch below.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: knight-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NEXT_PUBLIC_SITE_URL: "https://www.knightmedicalbilling.com"

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing repository/environment secret: $name"
              exit 1
            fi
          done

      - name: Install pinned SSH identity
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/knight_deploy
          chmod 600 ~/.ssh/knight_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release without production data or secrets
        timeout-minutes: 15
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          PORT="${VPS_PORT:-22}"
          SHA="${{ github.sha }}"
          ssh -i ~/.ssh/knight_deploy -p "$PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" "mkdir -p /srv/knight/releases/$SHA"
          rsync -az --delete \
            --exclude='.git/' --exclude='.next/' --exclude='node_modules/' \
            --exclude='data/' --exclude='blog-media/' --exclude='.env' --exclude='.env.*' \
            --exclude='preview/' --exclude='tsconfig.tsbuildinfo' \
            -e "ssh -i ~/.ssh/knight_deploy -p $PORT -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            ./ "$VPS_USER@$VPS_HOST:/srv/knight/releases/$SHA/"

      - name: Deploy, health-check and code-only rollback
        timeout-minutes: 25
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          PORT="${VPS_PORT:-22}"
          SHA="${{ github.sha }}"
          # The deploy user is non-root. deploy.sh elevates only the exact
          # systemctl restart via the restricted sudoers policy documented in
          # DEPLOYMENT.md.
          ssh -i ~/.ssh/knight_deploy -p "$PORT" \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" "/srv/knight/releases/$SHA/ops/deploy.sh $SHA"

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/knight_deploy
